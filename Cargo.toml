[package]
name = "zriz-runner"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/ZrizTech/runner"
homepage = "https://zriz.io"
description = "zriz runner: runs in your network, executes ops sent by the zriz cloud, and holds every secret"
publish = false

[lib]
name = "zriz_runner"
path = "src/lib.rs"

[[bin]]
name = "zriz-runner"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
url = "2"
base64 = "0.22"
jsonschema = { version = "0.33", default-features = false }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "signal", "net", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
mysql_async = { version = "0.34", default-features = false, features = ["rustls-tls"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
