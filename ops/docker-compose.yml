name: zriz-runner

# restart: on-failure:3 (runner). The runner exits with code 2 (config error) or 3 (the cloud refused
# the key: 401 or 403). Docker's `on-failure` restarts on ANY non-zero code and cannot exclude one,
# so we cap it at 3 tries: then the container stays stopped (`docker compose ps` shows Exited) and
# the log holds one line with the cause and the fix. To fix a refused key: `zz runners init --env <env>`,
# then `docker compose up -d --force-recreate runner`. `docker restart` keeps the old key.
# The worker sidecar keeps `unless-stopped`: it holds no key and has no exit code to loop on.
services:
  runner:
    image: ${ZRIZ_RUNNER_IMAGE:?}
    hostname: ${ZRIZ_RUNNER_NAME:-runner}
    # format: raw (Docker Compose 2.30 or later): a `$` or ` #` in a value stays as it is.
    env_file:
      - path: .env
        format: raw
    environment:
      ZRIZ_RUNNER_CONFIG: /etc/zriz-runner/config.json
    user: "65532:65532"
    volumes:
      - ./config.json:/etc/zriz-runner/config.json:ro
      - zriz-sock:/run/zriz
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 256m
    pids_limit: 128
    restart: on-failure:3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Browser and cli sidecar. Holds no runner secret (no env_file). Listens only on the unix
  # socket in zriz-sock. Default network only: it needs egress to the target, never the db overlay.
  worker:
    image: ${ZRIZ_WORKER_IMAGE:?}
    user: "65532:65532"
    environment:
      ZRIZ_WORKER_SOCKET: /run/zriz/worker.sock
    volumes:
      - zriz-sock:/run/zriz
    read_only: true
    tmpfs:
      - /tmp:size=512m,uid=65532,gid=65532,mode=0700
    shm_size: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zriz-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=0770,size=1m
