name: release

# On a tag v1.2.3: build, push, sign and attest the runner and worker images,
# and attach static Linux binaries with a SHA256SUMS file to the GitHub release.
# workflow_dispatch is a dry run: it builds everything and publishes nothing.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as CI, on this commit. Images are built only after they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  # Static Linux binaries (musl) for the install.sh shape: no Docker, no libc.
  binary:
    needs: ci
    name: binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Third-party build code runs here: read rights only, no stored token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Tag must equal the Cargo.toml version
        if: github.event_name == 'push'
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v${cargo_version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Install the targets and cargo-zigbuild
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          pip install cargo-zigbuild==0.20.1 ziglang==0.14.1

      - name: Build
        run: |
          short=$(printf '%.12s' "$GITHUB_SHA")
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          mkdir dist
          for arch in x86_64 aarch64; do
            ZRIZ_BUILD_SHA="$short" cargo zigbuild --locked --release \
              --target "${arch}-unknown-linux-musl" --bin zriz-runner
            cp "target/${arch}-unknown-linux-musl/release/zriz-runner" \
              "dist/zriz-runner-${version}-${arch}-linux"
          done
          (cd dist && sha256sum zriz-runner-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Runs no build code. It only checks and uploads what the binary job made.
  publish:
    needs: binary
    if: github.event_name == 'push'
    name: publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attach to the GitHub release (a version is published once)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Only a draft may be completed (a re-run of a failed upload).
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [ "$draft" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes $pre
          fi
          # Never replace a file: upload only names the draft does not have.
          have=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for f in dist/*; do
            if printf '%s\n' "$have" | grep -qxF "$(basename "$f")"; then
              echo "skip $f (already uploaded)"
            else
              gh release upload "$GITHUB_REF_NAME" "$f"
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false

  image:
    needs: ci
    name: image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runner
            image: ghcr.io/zriztech/runner
            dockerfile: Dockerfile
          - name: worker
            image: ghcr.io/zriztech/worker
            dockerfile: worker/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All tags and main: needed for the order checks below.
          fetch-depth: 0

      - name: Tagged commit must be on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Tag must equal the Cargo.toml version
        if: github.event_name == 'push'
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Build id is the first 12 chars of the commit
        id: sha
        run: |
          short=$(printf '%.12s' "$GITHUB_SHA")
          if ! [[ "$short" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::bad build id: $short"
            exit 1
          fi
          echo "short=$short" >> "$GITHUB_OUTPUT"

      # Only the worker needs QEMU: it has no compile step. The runner cross-compiles.
      - if: matrix.name == 'worker'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version must be new, and is it the highest?
        id: order
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "${IMAGE}:${version}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${version} already exists"
            exit 1
          fi
          # 1.2 and latest move only for the highest stable version. A pre-release leaves that to the metadata action.
          highest=true
          case "$version" in
            *-*) ;;
            *)
              top=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -- '-' | sort -V | tail -n1)
              [ "$top" = "$GITHUB_REF_NAME" ] || highest=false
              ;;
          esac
          echo "highest=${highest}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          # latest only for a release that is not a pre-release, and only the highest.
          flavor: latest=${{ steps.order.outputs.highest == 'false' && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.order.outputs.highest != 'false' }}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=zriz-${{ matrix.name }}
            ${{ matrix.name == 'runner' && 'org.opencontainers.image.licenses=Apache-2.0' || '' }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the runner has a build id. The worker takes no build arg.
          build-args: ${{ matrix.name == 'runner' && format('ZRIZ_BUILD_SHA={0}', steps.sha.outputs.short) || '' }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest (keyless)
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "- pushed: ${PUSH}"
            echo "- digest: \`${DIGEST}\`"
            echo "- reference: \`${IMAGE}@${DIGEST}\`"
            echo "- tags:"
            while read -r t; do printf '  - %s\n' "$t"; done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
